# 배포 전 품질 평가용 고정 질문 세트 — 직접 추가·수정하세요.
# python scripts/eval.py 가 각 질문으로 에이전트를 실행하고, 판사 LLM(config/judge.yaml 기준)으로 채점합니다.
# 아래 통과 기준을 못 넘으면 실패(종료 코드 1)로 끝나서 배포·머지를 막는 데 쓸 수 있습니다.
#
#   id            : 영문 고유 ID
#   question      : 사용자 질문
#   agenda        : (선택) 아젠다 ID
#   must_mention  : (선택) 리포트에 반드시 나와야 할 핵심 단어. 목록 안의 목록은 '그중 하나'
#                   예) [META, [재구매, 리텐션]]  → META 와 (재구매 또는 리텐션) 이 모두 있어야 함

thresholds:
  avg_score: 3.8        # 전체 평균 점수(1~5) 최소
  case_score: 3.0       # 질문별 최종 점수 최소
  criterion_avg: 3.0    # 기준별 평균 점수 최소 (예: 근거성 평균)
  must_mention_rate: 1.0 # 핵심 단어 포함률 최소 (1.0 = 전부 맞혀야 함)

# 지금 질문들은 임시 DB에 일부러 심어둔 특이사항 4종을 찾아내는지 봅니다 (README 참고).
cases:
  - id: ad_roas_drop
    question: 광고비는 늘었는데 ROAS가 떨어졌다
    agenda: ad_efficiency
    must_mention: [META, ROAS]

  - id: product_returns
    question: 특정 상품 반품이 늘었다
    agenda: product_issue
    must_mention: [[린넨, P007], 반품률]

  - id: retention_drop
    question: 신규 고객은 느는데 재구매가 약하다
    agenda: retention
    must_mention: [[재구매, M+1, 리텐션]]

  - id: promo_after
    question: 추석 세일 이후 매출이 왜 급감했지?
    agenda: promo_review
    must_mention: [추석]

  - id: weekly_free
    question: 이번 주 매출이 지난주보다 줄었다. 원인이 뭐야?
    agenda: weekly_sales
