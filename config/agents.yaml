# 멀티 에이전트 설정 — 코드 수정 없이 에이전트를 조정합니다.
# 흐름: [분석 에이전트들 동시 실행] → 리포트 작성 에이전트 → 평가 에이전트(미달 시 재작성) → 저장
#
# 실행 모드 (.env 의 AGENT_MODE 가 기본값, 화면·CLI --mode·평가 스크립트 --mode 로 바꿀 수 있음)
#   auto  : 요청 목적에 따라 아래 routing 규칙으로 자동 선택 (기본)
#   single: 분석 에이전트 1개 (아젠다를 고르면 아젠다 순서대로, 아니면 자유 분석)
#   multi : 아래 agents 중 enabled 인 에이전트를 동시에 실행

routing:
  auto_report: single   # 정기 자동 리포트(아젠다) → 빠르고 저렴하게
  explore: multi        # 자연어 질문(탐색 분석 화면, CLI, API) → 놓치는 원인 없게
  eval: multi           # 평가 스크립트 기본값 (--mode 로 변경 가능)
#
#   id          : 영문 고유 ID (SQL 결과 이름 앞에 붙음: structured → S_r1, explorer → E_r1)
#   name        : 화면·로그에 보일 이름
#   enabled     : false 면 멀티 모드에서 제외
#   use_agenda  : true 면 선택된 아젠다의 단계를 따름 (아젠다가 없으면 가장 맞는 아젠다를 스스로 고름)
#   max_steps   : 이 에이전트의 최대 도구 호출 턴 수 (없으면 .env 의 MAX_AGENT_STEPS)
#   instructions: 이 에이전트에게만 주는 역할 지시문 (자유롭게 수정)

agents:
  - id: structured
    name: 정형 분석
    enabled: true
    use_agenda: true
    max_steps: 10
    instructions: |
      당신은 '정형 분석' 담당입니다. 지표 사전의 정의와 아젠다의 분석 순서를 엄격하게 따릅니다.
      - 아젠다 단계를 하나도 건너뛰지 말고 순서대로 확인합니다.
      - 모든 지표는 지표 사전의 계산식 그대로 계산합니다.
      - 비교 기간(전주/전월/행사 전후)을 반드시 명시합니다.
      목표: 표준 점검을 빠짐없이, 재현 가능한 숫자로 남기는 것.

  - id: explorer
    name: 자율 탐색
    enabled: true
    use_agenda: false
    max_steps: 10
    instructions: |
      당신은 '자율 탐색' 담당입니다. 아젠다의 정해진 순서에 묶이지 않고 스스로 가설을 세워 파고듭니다.
      - 표준 점검(채널·카테고리 합계)에서 보이지 않는 원인을 찾습니다: 세그먼트 교차(채널×상품, 신규×채널, 연령×카테고리 등),
        특정 기간·캠페인·상품 하나에 몰린 변화, 반대 방향으로 움직이는 지표.
      - 처음 세운 가설이 틀리면 버리고 다른 가설로 넘어갑니다. 기각한 가설도 메모에 남깁니다.
      - 지표를 계산할 때는 지표 사전의 정의를 지킵니다.
      목표: 정형 점검이 놓칠 수 있는 예상 밖의 원인과 반례를 찾는 것.

# 리포트 작성 에이전트 (단일·멀티 모드 공통)
# 분석 에이전트의 메모와 실제 조회 결과만 보고 리포트를 씁니다. 숫자를 새로 조회하지 않습니다.
writer:
  name: 리포트 작성
  instructions: |
    - 숫자는 반드시 조회 결과에 있는 값만 사용합니다.
    - 질문 성격에 맞게 형식을 고릅니다. 단순 사실 질문(예: "지난달 매출 얼마야?")은 짧은 답 형식,
      원인·비교·개선을 묻는 질문은 전체 리포트 형식으로 씁니다.
    - 에이전트가 여러 명이면 같은 결론은 '(교차 확인)'으로 표시하고, 한쪽만 찾은 발견과 결론이 다른 부분은 따로 정리합니다.
    - 읽는 사람은 마케팅·MD 실무자입니다. 용어는 쉽게, 액션은 담당과 우선순위가 보이게 씁니다.

# 평가 에이전트 = 리포트 품질 판정(LLM judge). 리포트를 쓰지 않고 채점만 합니다 (쓰는 쪽과 채점하는 쪽 분리).
# 기준·통과 점수·재작성 횟수는 config/judge.yaml, 모델은 .env 의 JUDGE_MODEL 에서 조정합니다.
# 기준 미달이면 판정 의견을 리포트 작성 에이전트에 보내 다시 쓰게 합니다.
