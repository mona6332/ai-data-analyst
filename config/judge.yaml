# 리포트 품질 판정(LLM judge) 설정 — 직접 수정해도 됩니다.
# 분석 에이전트가 리포트를 쓰면, 별도의 판사 LLM이 아래 기준으로 1~5점 채점합니다.
# 통과 기준에 못 미치면 피드백을 붙여 리포트를 다시 쓰게 합니다 (max_revisions 회까지).

enabled: true
pass_score: 3.5        # 가중 평균 점수(1~5)가 이 값 이상이어야 통과
min_criterion_score: 2 # 어느 한 기준이라도 이 점수 미만이면 불통과
max_revisions: 1       # 불통과 시 재작성 최대 횟수 (0이면 채점만 하고 그대로 저장)

# 리포트 속 숫자가 실제 조회·분석 결과에 있는지 코드로 먼저 대조합니다 (LLM 호출 없음).
# 결과는 판사에게 참고 자료로 전달됩니다.
number_check:
  enabled: true
  tolerance: 0.01      # 반올림 허용 오차 (상대 1%)

criteria:
  - key: grounding
    name: 근거성
    weight: 2
    description: 리포트의 수치가 실제 조회·분석 결과에 있는가. 결과에 없는 숫자를 지어내지 않았는가.
  - key: metric_definition
    name: 지표 정의 준수
    weight: 1
    description: 지표 사전의 정의·계산식대로 계산했는가 (예 ROAS = 귀속 매출 / 광고비).
  - key: relevance
    name: 질문 적합성
    weight: 1.5
    description: 사용자가 물은 문제 상황에 직접 답했는가. 비교 기준(전주·전월·행사 전후)이 명확한가.
  - key: causal_rigor
    name: 원인 구분
    weight: 1
    description: 데이터로 확인된 사실과 추정을 구분했는가. 추가 확인이 필요한 것을 밝혔는가.
  - key: actionability
    name: 액션 구체성
    weight: 1
    description: 권장 액션이 담당·우선순위가 드러나게 구체적인가.
